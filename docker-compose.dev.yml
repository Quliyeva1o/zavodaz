# Local services: docker compose -f docker-compose.dev.yml up -d
#   Postgres 13 (same major version as the hosting) on localhost:5442
#   Mailpit SMTP localhost:1027, inbox http://localhost:8027
services:
  db:
    image: postgres:13-alpine
    environment:
      POSTGRES_USER: zavod
      POSTGRES_PASSWORD: zavod
      POSTGRES_DB: zavod
    ports:
      - "5442:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1027:1025"
      - "8027:8025"
volumes:
  pgdata-dev:
